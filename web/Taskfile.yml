version: '3'

vars:
  SERVICE_NAME: web
  BIN_DIR: dist

tasks:
  default:
    silent: true
    cmds:
      - task: help

  help:
    desc: 显示帮助信息
    silent: true
    cmds:
      - |
        cat << 'EOF'
        {{.SERVICE_NAME}} 构建工具

        可用命令:
          task build        - 编译 React 前端到 ./dist
          task build:image  - 构建 Docker 镜像
          task dev          - 启动 Vite 开发服务器
          task clean        - 清除编译产物
          task help         - 显示此帮助信息

        使用方法:
          task                    - 默认显示帮助信息
          task build              - 执行编译
          task build -- v1.0.0    - 指定版本号编译
          task build:image        - 构建 Docker 镜像
          task build:image -- v1.0.0  - 指定版本号构建镜像
          task dev                - 启动开发服务器
          task clean              - 清除编译产物
        EOF

  build:
    desc: 编译 React 前端
    silent: true
    cmds:
      - |
        PYTHON_CMD=""
        if command -v python3 &> /dev/null; then
          PYTHON_CMD="python3"
        elif command -v python &> /dev/null; then
          PYTHON_CMD="python"
        else
          echo "错误: 未找到 python3 或 python 命令"
          exit 1
        fi
        $PYTHON_CMD scripts/build.py {{.CLI_ARGS}}

  image:
    desc: 构建 Docker 镜像
    silent: true
    cmds:
      - |
        PYTHON_CMD=""
        if command -v python3 &> /dev/null; then
          PYTHON_CMD="python3"
        elif command -v python &> /dev/null; then
          PYTHON_CMD="python"
        else
          echo "错误: 未找到 python3 或 python 命令"
          exit 1
        fi
        $PYTHON_CMD scripts/build_image.py {{.CLI_ARGS}}

  dev:
    desc: 启动 Vite 开发服务器
    silent: true
    cmds:
      - npm run dev

  clean:
    desc: 清除编译产物
    silent: true
    cmds:
      - rm -rf {{.BIN_DIR}}
      - echo "已清除编译产物"

project:
  name: chat-server
  version: v0.0.0

logger:
  level: info
  dir: "./logs"
  max_size: 100
  max_backups: 3
  max_age: 7
  compress: true
  local_time: true

database:
  host: mysql
  port: 3306
  user: root
  password: 123456
  dbname: knowsync
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 5m

redis:
  addrs:
    - "redis:6379"
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 1

grpc:
  port: 50054

ws:
  port: 50055

jwt:
  public_key_path: ./configs/jwt-public.pem

grpc:
  port: 5053

log:
  level: info
  dir: ./logs
  max_size: 100
  max_backups: 3
  max_age: 7
  compress: true
  local_time: true

redis:
  addrs:
    - redis:6379
  password: ""
  db: 0

database:
  host: mysql
  port: 3306
  user: root
  password: password
  dbname: knowsync

gateway:
  addr: http://gateway:8080

service_token:
  secret: "change-me-to-a-random-secret"

embedder:
  base_url: https://api.siliconflow.cn/v1
  api_key: ""
  model: Qwen/Qwen3-Embedding-8B
  dimensions: 1536

llm:
  base_url: https://api.deepseek.com/v1
  api_key: ""
  model: deepseek-chat
  thinking_intensity: max

chromem:
  path: ./data/vectors

worker:
  concurrency: 3
  max_retries: 3

web_search:
  base_url: https://api.duckduckgo.com/
  api_key: ""

services:
  mysql:
    image: mysql:8.0
    container_name: knowsync-mysql
    restart: unless-stopped
    env_file: .env
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - knowsync-net

  redis:
    image: redis:7-alpine
    container_name: knowsync-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - knowsync-net

  user-server:
    image: knowsync/user-server:latest
    container_name: knowsync-user-server
    restart: unless-stopped
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./user-server/logs:/app/logs
    networks:
      - knowsync-net

  repo-server:
    image: knowsync/repo-server:latest
    container_name: knowsync-repo-server
    restart: unless-stopped
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./repo-server/logs:/app/logs
    networks:
      - knowsync-net

  gateway:
    image: knowsync/gateway:latest
    container_name: knowsync-gateway
    restart: unless-stopped
    env_file: .env
    depends_on:
      user-server:
        condition: service_started
      repo-server:
        condition: service_started
    volumes:
      - ./gateway/logs:/app/logs
      - ./data/files:/app/data
    networks:
      - knowsync-net

  web:
    image: knowsync/web:latest
    container_name: knowsync-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      gateway:
        condition: service_started
    networks:
      - knowsync-net

  ai-server:
    image: knowsync/ai-server:latest
    container_name: knowsync-ai-server
    restart: unless-stopped
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      repo-server:
        condition: service_started
    volumes:
      - ./ai-server/logs:/app/logs
      - ./data/vectors:/app/data/vectors
    networks:
      - knowsync-net

  chat-server:
    image: knowsync/chat-server:latest
    container_name: knowsync-chat-server
    restart: unless-stopped
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./chat-server/logs:/app/logs
    networks:
      - knowsync-net

networks:
  knowsync-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:

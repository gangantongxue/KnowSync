version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: knowsync-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: knowsync
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - knowsync-net

  redis:
    image: redis:7-alpine
    container_name: knowsync-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - knowsync-net

  user-server:
    image: knowsync/user-server:latest
    container_name: knowsync-user-server
    restart: unless-stopped
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      DATABASE_USER: root
      DATABASE_PASSWORD: "123456"
      DATABASE_DBNAME: knowsync
      REDIS_ADDRS: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      GRPC_PORT: "50051"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - knowsync-net

  gateway:
    image: knowsync/gateway:latest
    container_name: knowsync-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CONFIG_PATH: /app/configs/config.yaml
      USER_SERVER_ADDR: user-server:50051
    depends_on:
      user-server:
        condition: service_started
    networks:
      - knowsync-net

networks:
  knowsync-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:

project:
  name: gateway
  version: v0.0.0

logger:
  level: info
  dir: "./logs"
  max_size: 100
  max_backups: 3
  max_age: 7
  compress: true
  local_time: true

http:
  port: 8080

auth:
  rsa_public_key_path: "./configs/jwt-public.pem"

storage:
  root_dir: "./data"

grpc_clients:
  targets:
    user_server: "user-server:50051"
    repo_server: "repo-server:50052"
    ai_server: "ai-server:50053"

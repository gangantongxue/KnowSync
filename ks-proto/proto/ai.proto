syntax = "proto3";

package proto;

option go_package = "ks-proto/pkg/pb";

// ========== 会话 ==========

// ChatSession 会话
message ChatSession {
  string id = 1;
  string user_id = 2;
  string title = 3;
  int64 created_at = 4;
  int64 updated_at = 5;
}

// ========== 消息 ==========

// ChatMessage 聊天消息
message ChatMessage {
  string id = 1;
  string session_id = 2;
  string role = 3; // "user" / "assistant"
  string content = 4; // 正式回复内容
  string thinking = 5; // 思考过程（与内容分开存储和返回）
  int64 created_at = 6;
}

// ChatMessageMeta 消息摘要（列表用，不含 thinking 和完整 content）
message ChatMessageMeta {
  string id = 1;
  string role = 2;
  string content = 3; // 摘要或截断后的内容
  int64 created_at = 4;
}

// ========== 流式对话 ==========

message ChatRequest {
  string user_id = 1;
  string session_id = 2; // 新会话传空，服务端自动创建
  string message = 3; // 用户输入
}

// AskUserEvent 反问用户事件
message AskUserEvent {
  string question = 1; // 问题内容
  string type = 2; // "single" / "multiple"
  repeated string options = 3; // 选项列表
  bool has_other = 4; // 是否包含"其他"自定义选项
}

// ChatResponse 流式对话响应
message ChatResponse {
  string session_id = 1;
  string message_id = 2; // 最终的消息ID（finished 时设置）

  oneof event {
    string thinking_chunk = 3; // 思考过程片段
    string content_chunk = 4; // 正式回答片段
    AskUserEvent ask_user_event = 9; // 反问用户
  }

  bool thinking_finished = 5; // 思考结束标记
  bool finished = 6; // 全部结束标记

  string title = 7; // 会话标题（finished 时可能有更新）
  bool title_updated = 8; // 标题是否更新
}

// ========== 会话管理 ==========

message GetChatSessionsRequest {
  string user_id = 1;
  int64 cursor = 2; // 游标时间戳（updated_at），首次查询传 0
  int32 limit = 3; // 返回条数（默认 20）
}

message GetChatSessionsResponse {
  bool success = 1;
  string msg = 2;
  repeated ChatSession sessions = 3;
  bool has_more = 4; // 是否还有更多数据
}

message GetChatMessagesRequest {
  string user_id = 1;
  string session_id = 2;
  int64 cursor = 3; // 游标时间戳（created_at），首次查询传 0
  int32 limit = 4; // 返回条数（默认 50）
}

message GetChatMessagesResponse {
  bool success = 1;
  string msg = 2;
  repeated ChatMessage messages = 3;
  bool has_more = 4; // 是否还有更多数据
}

message DeleteChatSessionRequest {
  string user_id = 1;
  string session_id = 2;
}

message DeleteChatSessionResponse {
  bool success = 1;
  string msg = 2;
}

// ========== 已有的（保持不变） ==========

message SearchRequest {
  string user_id = 1;
  string query = 2; // 搜索文本
  int32 page = 3; // 页码（从 1 开始）
  int32 page_size = 4; // 每页条数（默认 20）
}

message SearchResponse {
  bool success = 1;
  string msg = 2; // 错误描述
  repeated string repo_ids = 3;
  int32 total_pages = 4; // 总页数
  bool has_more = 5; // 是否还有更多数据
}

message UpdateRepoVisibilityRequest {
  string repo_id = 1;
  bool is_public = 2;
}

message UpdateRepoVisibilityResponse {
  bool success = 1;
}

// VectorizeArticleRequest 向量化文章请求
message VectorizeArticleRequest {
  string user_id = 1;
  string repo_id = 2;
  string file_path = 3;
}

// VectorizeArticleResponse 向量化文章响应
message VectorizeArticleResponse {
  bool success = 1;
  string msg = 2;
}

// DeleteRepoVectorsRequest 删除知识库向量请求
message DeleteRepoVectorsRequest {
  string repo_id = 1;
}

// DeleteRepoVectorsResponse 删除知识库向量响应
message DeleteRepoVectorsResponse {
  bool success = 1;
  string msg = 2;
}

// DeleteFileVectorsRequest 删除文件向量请求
message DeleteFileVectorsRequest {
  string repo_id = 1;
  string file_path = 2;
}

// DeleteFileVectorsResponse 删除文件向量响应
message DeleteFileVectorsResponse {
  bool success = 1;
  string msg = 2;
}

// ========== Service ==========

service AIService {
  // Chat 流式对话（主要入口）
  rpc Chat(ChatRequest) returns (stream ChatResponse);

  // Search 全文搜索
  rpc Search(SearchRequest) returns (SearchResponse);

  // 会话管理
  rpc GetChatSessions(GetChatSessionsRequest) returns (GetChatSessionsResponse);
  rpc GetChatMessages(GetChatMessagesRequest) returns (GetChatMessagesResponse);
  rpc DeleteChatSession(DeleteChatSessionRequest) returns (DeleteChatSessionResponse);

  // UpdateRepoVisibility 更新仓库可见性
  rpc UpdateRepoVisibility(UpdateRepoVisibilityRequest) returns (UpdateRepoVisibilityResponse);

  // VectorizeArticle 向量化文章（异步）
  rpc VectorizeArticle(VectorizeArticleRequest) returns (VectorizeArticleResponse);

  // DeleteRepoVectors 删除知识库向量数据
  rpc DeleteRepoVectors(DeleteRepoVectorsRequest) returns (DeleteRepoVectorsResponse);

  // DeleteFileVectors 删除文件向量数据
  rpc DeleteFileVectors(DeleteFileVectorsRequest) returns (DeleteFileVectorsResponse);
}

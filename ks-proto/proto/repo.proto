syntax = "proto3";

package proto;

option go_package = "ks-proto/pkg/pb";

enum RepoVisibility {
  REPO_VISIBILITY_UNSPECIFIED = 0;
  PUBLIC = 1;
  PRIVATE = 2;
}

enum CollaboratorRole {
  COLLABORATOR_ROLE_UNSPECIFIED = 0;
  ADMIN = 1;
  DEVELOPER = 2;
  VIEWER = 3;
}

message Repo {
  string id = 1;
  string owner_id = 2;
  string name = 3;
  RepoVisibility visibility = 4;
  string description = 5;
  int64 article_count = 6;
  string created_at = 7;
  string updated_at = 8;
  int64 follower_count = 9;
}

message Collaborator {
  string repo_id = 1;
  string user_id = 2;
  CollaboratorRole role = 3;
}

message CreateRepoRequest {
  string owner_id = 1;
  string name = 2;
  RepoVisibility visibility = 3;
  string description = 4;
}

message CreateRepoResponse {
  Repo repo = 1;
}

message GetRepoRequest {
  string repo_id = 1;
  string user_id = 2;
}

message GetRepoResponse {
  Repo repo = 1;
  CollaboratorRole my_role = 2;
  bool is_following = 3;
}

message UpdateRepoRequest {
  string repo_id = 1;
  string user_id = 2;
  string name = 3;
  string description = 4;
  RepoVisibility visibility = 5;
}

message UpdateRepoResponse {
  Repo repo = 1;
}

message DeleteRepoRequest {
  string repo_id = 1;
  string user_id = 2;
}

message DeleteRepoResponse {}

message ListUserReposRequest {
  string user_id = 1;
}

message ListPublicReposRequest {}

message ListPublicReposResponse {
  repeated Repo repos = 1;
}

message ListUserReposResponse {
  repeated Repo repos = 1;
}

message AddCollaboratorRequest {
  string repo_id = 1;
  string operator_id = 2;
  string user_id = 3;
  CollaboratorRole role = 4;
}

message AddCollaboratorResponse {}

message UpdateCollaboratorRequest {
  string repo_id = 1;
  string operator_id = 2;
  string user_id = 3;
  CollaboratorRole role = 4;
}

message UpdateCollaboratorResponse {}

message RemoveCollaboratorRequest {
  string repo_id = 1;
  string operator_id = 2;
  string user_id = 3;
}

message RemoveCollaboratorResponse {}

message ListCollaboratorsRequest {
  string repo_id = 1;
  string user_id = 2;
}

message ListCollaboratorsResponse {
  repeated Collaborator collaborators = 1;
}

message FollowRepoRequest {
  string repo_id = 1;
  string user_id = 2;
}

message FollowRepoResponse {}

message UnfollowRepoRequest {
  string repo_id = 1;
  string user_id = 2;
}

message UnfollowRepoResponse {}

message ListFollowedReposRequest {
  string user_id = 1;
}

message ListFollowedReposResponse {
  repeated Repo repos = 1;
}

message IncrementArticleCountRequest {
  string repo_id = 1;
  int32 delta = 2;
}

message IncrementArticleCountResponse {}

service RepoService {
  rpc CreateRepo(CreateRepoRequest) returns (CreateRepoResponse);
  rpc GetRepo(GetRepoRequest) returns (GetRepoResponse);
  rpc UpdateRepo(UpdateRepoRequest) returns (UpdateRepoResponse);
  rpc DeleteRepo(DeleteRepoRequest) returns (DeleteRepoResponse);
  rpc ListUserRepos(ListUserReposRequest) returns (ListUserReposResponse);
  rpc ListPublicRepos(ListPublicReposRequest) returns (ListPublicReposResponse);

  rpc AddCollaborator(AddCollaboratorRequest) returns (AddCollaboratorResponse);
  rpc UpdateCollaborator(UpdateCollaboratorRequest) returns (UpdateCollaboratorResponse);
  rpc RemoveCollaborator(RemoveCollaboratorRequest) returns (RemoveCollaboratorResponse);
  rpc ListCollaborators(ListCollaboratorsRequest) returns (ListCollaboratorsResponse);

  rpc FollowRepo(FollowRepoRequest) returns (FollowRepoResponse);
  rpc UnfollowRepo(UnfollowRepoRequest) returns (UnfollowRepoResponse);
  rpc ListFollowedRepos(ListFollowedReposRequest) returns (ListFollowedReposResponse);

  rpc IncrementArticleCount(IncrementArticleCountRequest) returns (IncrementArticleCountResponse);
}
